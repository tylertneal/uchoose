name: Overpass test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:20];
          (
            node["amenity"~"^(restaurant|fast_food)$"]["name"](around:8000,35.2271,-80.8431);
            way["amenity"~"^(restaurant|fast_food)$"]["name"](around:8000,35.2271,-80.8431);
          );
          out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            r=$(curl -s -m 40 -o out.txt -w '%{http_code} %{time_total}s %{size_download}B' -A uChoose-Android/1.0 -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "data=$Q" "$u" || true)
            echo "RESULT $u -> $r :: $(head -c 200 out.txt | tr '\n' ' ')"
          done
