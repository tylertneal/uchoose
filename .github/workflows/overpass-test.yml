name: Overpass test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='uChoose-Android/1.0 (github.com/tylertneal/uchoose)'
          VB='-80.92,35.30,-80.76,35.15'
          t() { r=$(curl -s -m 30 -o out.txt -w '%{http_code} %{time_total}s %{size_download}B' -A "$UA" "$1" || true); n=$(grep -o '"name"' out.txt | wc -l); echo "RESULT [$2] $r names=$n :: $(head -c 300 out.txt | tr '\n' ' ')"; }
          t "https://nominatim.openstreetmap.org/search?q=restaurant&viewbox=$VB&bounded=1&limit=40&format=jsonv2&extratags=1&addressdetails=1" nom-q-restaurant
          sleep 2
          t "https://nominatim.openstreetmap.org/search?amenity=restaurant&viewbox=$VB&bounded=1&limit=40&format=jsonv2&extratags=1&addressdetails=1" nom-amenity-restaurant
          sleep 2
          t "https://nominatim.openstreetmap.org/search?q=fast%20food&viewbox=$VB&bounded=1&limit=40&format=jsonv2&extratags=1&addressdetails=1" nom-q-fastfood
          sleep 2
          t "https://nominatim.openstreetmap.org/search?q=%5Bamenity%3Dfast_food%5D&viewbox=$VB&bounded=1&limit=40&format=jsonv2" nom-bracket-fastfood
          t "https://photon.komoot.io/api/?q=restaurant&lat=35.2271&lon=-80.8431&limit=50&osm_tag=amenity:restaurant" photon-restaurant
          t "https://photon.komoot.io/api/?q=fast%20food&lat=35.2271&lon=-80.8431&limit=50&osm_tag=amenity:fast_food" photon-fastfood
          t "https://photon.komoot.io/api/?q=food&lat=35.2271&lon=-80.8431&limit=50&osm_tag=amenity:fast_food&location_bias_scale=0.1" photon-food-ff
